# =============================================================================
# GitLab CI/CD — test, prove the image builds, ship the commit to the server.
#
# The shape:
#
#   push anywhere      -> test
#   push to develop    -> test, build
#   push to master     -> test, build, deploy to production (manual button)
#
# "Deploy" here does not mean "pull an image". The production server is in
# Iran and reaches neither GitLab's registry nor Docker Hub, so it can neither
# clone this repository nor pull an image built from it. The deploy job sends
# the commit over SSH and builds it on the server, against Iranian mirrors —
# scripts/ship.sh, which is the same thing `make ship` runs by hand.
#
# That has a consequence worth stating: the bytes production runs were built
# on production, not by this pipeline. The `build` job below is a check that
# the image still builds, not the artefact that gets deployed.
#
# There is no stage environment. develop is verified locally with
# `make up`; the pipeline's job on that branch is to prove the suite still
# passes and the image still builds, so the merge to master has nothing
# left to discover.
#
# Production is a button, not a push. See "Why production is manual" in
# docs/cicd.md — briefly: the entrypoint applies migrations on the way up, so
# an automatic production deploy means an unreviewed migration runs against
# the real database while nobody is watching.
#
# Before this runs at all, set the variables listed in docs/cicd.md under
# Settings > CI/CD > Variables. Every deploy variable must be **Protected**
# so a merge request from a fork cannot read the production SSH key.
# =============================================================================

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2

  # Where scripts/ship.sh sends the code. Kept here rather than in the script
  # so a second server needs no commit — override them in Settings > CI/CD >
  # Variables. None of these is a secret; the SSH key is.
  SHIP_HOST: "87.248.131.223"
  SHIP_PORT: "9011"
  SHIP_USER: "amiiiriii"
  SHIP_PATH: "/srv/dental"

# -----------------------------------------------------------------------------
# Test
# -----------------------------------------------------------------------------
test:
  stage: test
  image: python:3.12-slim
  # No Postgres or Redis service: utils/test_runner.py swaps in SQLite, a
  # local-memory cache and inline Celery. Adding them here would test a
  # configuration the suite does not use.
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    # develop settings carry their own throwaway keys, so the suite needs no
    # secrets. Anything real here would be readable from a merge request.
    DJANGO_ENV: develop
    SECRET_KEY: ci-only-not-a-real-key
    OTP_SECRET_KEY: ci
    RESET_PREFIX: ci
    RESET_SUFFIX: ci
    SECURE_ADMIN_PANEL: ci
    ALLOWED_HOSTS: localhost,127.0.0.1
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    # The application lives under src/; the repository root holds only how it
    # is built and shipped.
    - cd src
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py test --verbosity=2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# `--check --dry-run` above is the one worth explaining: it fails when a model
# was edited without generating the migration. Without it that lands on the
# server, where the entrypoint runs `migrate`, finds nothing to apply, and the
# schema silently disagrees with the code.

security:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir pip-audit
    - pip-audit -r requirements.txt --progress-spinner off
  # Advisory: a new CVE published overnight should show up, but it should not
  # block a deploy that fixes something else. Check it, then decide.
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # Without these the CLI looks for /var/run/docker.sock, which does not
    # exist in this container, so every build died on "Cannot connect to the
    # Docker daemon". The daemon is the `docker:27-dind` service above: it is
    # reachable as the host `docker` and, because DOCKER_TLS_CERTDIR is set,
    # only over TLS on 2376. The certificates it generates reach this job
    # through the /certs volume the two share.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  # Nothing is pushed and nothing is tagged for keeping. The image this job
  # produces is thrown away with the job, because the server builds its own —
  # it cannot reach a registry to pull one from. What this proves is that the
  # Dockerfile still builds at all, which is worth knowing before a deploy job
  # discovers it on the server with the site down.
  #
  # The mirror arguments are left at their defaults on purpose: this runner
  # reaches the real Debian archive and the real PyPI, and building against
  # the mirrors here would test the mirrors rather than the Dockerfile.
  script:
    - docker build --tag dental-app:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# Deploy
# -----------------------------------------------------------------------------
.deploy_template: &deploy
  stage: deploy
  image: alpine:3.20
  # The runner has to be one that can reach the server. In practice that is a
  # gitlab-runner installed on the laptop: it polls gitlab.com outbound, so it
  # needs no public address of its own, and it is already on the connection
  # that reaches both gitlab.com and the server. Register it with this tag —
  # `gitlab-runner register --tag-list iran-vpn` — or the job sits pending
  # forever with "no runner matching" and nothing else said.
  tags:
    - iran-vpn
  before_script:
    # git for `git archive`, which is how ship.sh packs the commit; curl for
    # the health check at the end of it.
    - apk add --no-cache openssh-client git curl bash
    - eval $(ssh-agent -s)
    # The key arrives as a File-type variable so its newlines survive; `tr` is
    # the usual repair when someone pastes it as a plain variable instead.
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Pinned host key rather than StrictHostKeyChecking=no: without it the
    # first connection trusts whatever answers, which is the whole attack.
    # Get the value with: ssh-keyscan -p 9011 -H your.server
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

deploy:production:
  <<: *deploy
  environment:
    name: production
    url: https://sbdental.ir
  # GitLab clones at a depth of 20 by default, and `git archive` can only pack
  # a commit it has. A shallow clone is fine for deploying the tip; it is not
  # fine for the rollback job below, which names an older SHA.
  variables:
    GIT_DEPTH: 0
  # Everything this does — the pre-deploy backup, the transfer, the remote
  # build, the health check — lives in scripts/ship.sh, so that pressing the
  # button and running `make ship` by hand are the same operation. A deploy
  # path that only exists inside CI is one nobody can run the day CI is the
  # thing that is broken.
  script:
    - sh scripts/ship.sh
  # The button. Nothing reaches production without someone pressing it: the
  # entrypoint applies migrations on the way up, so an automatic deploy means
  # an unreviewed migration runs against the real database while nobody is
  # watching.
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

rollback:production:
  <<: *deploy
  environment:
    name: production
    url: https://sbdental.ir
  variables:
    GIT_DEPTH: 0
    # Set this when running the job: the SHA to go back to.
    ROLLBACK_SHA: ""
  # A rollback is a deploy of an older commit, and it takes as long as a
  # deploy does — the server rebuilds. There is no registry to point at a
  # known-good tag instead, which is the price of the server not being able to
  # reach one. When minutes matter, `make ship` from a checkout of the old
  # commit does the same thing without waiting for a runner.
  script:
    - test -n "$ROLLBACK_SHA" || { echo "set ROLLBACK_SHA to the commit to roll back to"; exit 1; }
    - git rev-parse --verify "$ROLLBACK_SHA^{commit}"
    - SHIP_REF="$ROLLBACK_SHA" sh scripts/ship.sh
  # Rolling the code back does NOT roll a migration back. If the bad deploy
  # migrated the database, restore instead — scripts/restore.sh.
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
