# Stage: production's shape, production's failure modes, none of its reach.
#
#   docker compose --env-file env/.env.stage -f deploy/base.yml -f deploy/stage.yml up -d
#
# Same gunicorn, same nginx, same `DEBUG = False` render path as production —
# which is the point, because the bugs worth catching here are the ones that
# only exist with a real proxy in front and hashed static files behind.
#
# What it must never do is reach a patient. `config/settings/stage.py` forces
# SMS to the console and email to a file, so a staging run against a copied
# production database cannot text anyone.

services:
  web:
    env_file:
      - ./env/.env.stage
    # Not published. nginx is the only way in, so the app is never reachable
    # without the proxy's headers — the same shape as production.
    expose:
      - "8000"

  worker:
    env_file:
      - ./env/.env.stage

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      # Plain HTTP. Staging usually sits behind a tunnel or an internal
      # address; if it gets a public hostname, copy the production overlay's
      # certificate mounts instead of adding TLS here.
      - "8080:80"
    volumes:
      - ./nginx/stage.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    healthcheck:
      # 127.0.0.1, not localhost: in the alpine image `localhost` resolves to
      # ::1 first and nginx listens on IPv4 only, so every probe came back
      # "connection refused" and the container sat permanently unhealthy while
      # serving every request perfectly.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Database backup on a fixed interval, keeping the newest three. A service
  # rather than a cron entry on the host: it runs the same image, so it has
  # the same pg_dump version and the same settings the app does, and it needs
  # no configuration on whatever machine the stack lands on.
  backup:
    image: ${APP_IMAGE:-dental-app:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./env/.env.stage
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      BACKUP_KEEP: "3"
      # Every third day. Frequent enough that at most three days of work is
      # ever at risk, rare enough that three retained copies span nine days —
      # long enough to notice corruption that a nightly rotation would have
      # already overwritten.
      BACKUP_INTERVAL_DAYS: "3"
    volumes:
      # Same host directory the web container and the scripts use, so a
      # dump this service takes is one `scripts/restore.sh` can read back.
      - ../backups/${DJANGO_ENV:?set by deploy/env/.env.<environment>}:/app/backups
    # A plain shell loop — no cron daemon to keep alive in a container whose
    # only job is this.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Age comes from a marker file in the volume, not from an in-process
        # timer. This container is recreated on every deploy, and a plain
        # `sleep 3d` restarted its count each time: deploying more often than
        # the interval meant the backup never fired at all. The volume
        # survives a deploy, so the marker remembers across one.
        MARKER=/app/backups/.last-backup
        STALE=$$((BACKUP_INTERVAL_DAYS - 1))

        # Long enough for the web container's migrations to finish, so the
        # first dump on a fresh stack is of a settled schema.
        sleep 90

        while :; do
          if [ ! -f "$$MARKER" ] || [ -n "$$(find "$$MARKER" -mtime +$$STALE)" ]; then
            if python manage.py backup_db --keep "$$BACKUP_KEEP"; then
              touch "$$MARKER"
            else
              # Marker deliberately left alone: the next wake-up retries,
              # rather than a transient failure costing a whole interval.
              echo "[backup] failed"
            fi
          fi
          sleep 6h
        done

