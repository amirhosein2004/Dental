# Production proxy: TLS on 443, port 80 kept only for ACME and redirects.
#
# Replace sbdental.ir below if the domain changes — it appears in server_name
# and in the certificate paths, and the two must agree or nginx will not start.

# Don't advertise the exact nginx version in the `Server` header and on error
# pages. It does not stop anyone determined, but it does keep the site out of
# the result set when a fresh nginx CVE is scanned for by version string.
server_tokens off;

# --- Who the visitor actually is -------------------------------------------
#
# Everything that throttles reads the client address: the login lockout in
# `utils/security/login_throttle.py`, every `django-ratelimit` bucket, the
# captcha refresh limit. They read `X-Real-IP`, which the proxy block below
# sets from `$remote_addr`.
#
# With ArvanCloud (or any CDN) in front, `$remote_addr` is the CDN's edge, not
# the visitor — so every visitor collapses onto one counter. Five failed
# logins by anyone would lock out the whole site, and the contact form would
# rate-limit strangers against each other. That is not hypothetical: it is
# what happens the moment the DNS record starts being proxied.
#
# `real_ip_header` fixes `$remote_addr` itself, so `X-Real-IP`, the access log
# and `$binary_remote_addr` are all correct without touching Django.
#
# Safe to leave on with no CDN: nginx only believes the header when the
# connection *came from* one of the addresses below. A stranger connecting
# directly and inventing `ar-real-ip` is ignored.
#
# Ranges from https://www.arvancloud.ir/fa/ips.txt — re-check after any
# announcement from them. A range they have dropped costs nothing; a range
# they add silently sends that edge's traffic back to a single bucket.
set_real_ip_from 185.143.232.0/22;
set_real_ip_from 188.229.116.16/30;
set_real_ip_from 94.101.182.0/27;
set_real_ip_from 2.144.3.128/28;
set_real_ip_from 37.32.16.0/27;
set_real_ip_from 37.32.17.0/27;
set_real_ip_from 37.32.18.0/27;
set_real_ip_from 37.32.19.0/27;
set_real_ip_from 185.215.232.0/22;
set_real_ip_from 178.131.120.48/28;
set_real_ip_from 94.101.183.0/28;
set_real_ip_from 78.157.36.112/28;
set_real_ip_from 95.38.61.80/28;
real_ip_header ar-real-ip;

# The app is addressed through a variable, not an `upstream` block, so that
# nginx re-resolves the name instead of pinning it at startup.
#
# nginx looks an `upstream` server's hostname up once, when the worker starts,
# and keeps that address for the life of the process. A deploy recreates the
# web container, Docker hands it a new IP, and nginx goes on dialling the old
# one: every request 502s while `docker compose up -d` reports success and the
# web container's own logs look perfectly healthy. The only cure is
# restarting nginx, which nothing in the deploy does.
#
# `resolver 127.0.0.11` is Docker's embedded DNS; `valid=10s` is how long an
# answer is trusted, so a recreated container is picked up within ten seconds.
# `ipv6=off` because it answers AAAA for `web` on some daemons and nginx then
# tries an address nothing is listening on.
#
# The cost is upstream keepalive, which a variable target cannot use — every
# proxied request opens a fresh connection to gunicorn. At this traffic that
# is a rounding error next to a site that is silently down after a deploy.
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $django_upstream {
    default web:8000;
}

# --- Port 80, anything that is not our domain -------------------------------
#
# Without this block the server below is also the default, so a request
# carrying `Host: evil.example` matched it and was answered
# `301 https://evil.example/...` — an open redirect handed out by our own
# domain, useful for making a phishing link look like it came from us.
#
# `444` closes the connection with no response at all, which is the cheapest
# possible answer to the constant background scanning.
#
# /healthz is the exception: Compose probes `http://127.0.0.1/healthz`, whose
# Host is an address and therefore lands here. Answering 444 to it marks the
# container unhealthy and puts it in a restart loop while it serves every real
# request perfectly.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}

# --- Port 443, anything that is not our domain ------------------------------
#
# Refuses the TLS handshake outright when the SNI is not ours, so scanners
# hitting the bare IP never get as far as being told a hostname lives here.
# Needs no certificate of its own — that is the point of the directive.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

# --- Port 80: certificate renewal, then send everyone to HTTPS --------------
server {
    listen 80;
    server_name sbdental.ir www.sbdental.ir;

    # Must stay on plain HTTP and must not redirect: this is the path Let's
    # Encrypt fetches to prove the domain is ours, and it checks it over
    # port 80 before any certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # `$host` is safe here only because the catch-all above exists: this block
    # is reached only when the Host already matched a name in server_name.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name sbdental.ir www.sbdental.ir;

    ssl_certificate     /etc/letsencrypt/live/sbdental.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbdental.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla's "intermediate" list. TLS 1.3 picks its own suites and ignores
    # this; the line is entirely about TLS 1.2, where nginx's default
    # `HIGH:!aNULL:!MD5` still admits CBC and non-forward-secret suites.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Deliberately no OCSP stapling: Let's Encrypt retired its OCSP responders
    # in 2025, so `ssl_stapling on` would only fill the log with
    # "no valid OCSP response" on every reload.

    # 30 images at 5MB each is the gallery's own ceiling; nginx's 1MB default
    # would reject that as a 413 with no explanation the uploader can act on.
    client_max_body_size 60M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Compression pays for itself on Persian HTML and on the CSS bundle. Images
    # and woff2 are already compressed, so they are left out.
    #
    # Compressing HTML over TLS is the BREACH precondition, and it is safe here
    # only because Django masks the CSRF token with a fresh random pad on every
    # render — the ciphertext length no longer varies with a guessed prefix.
    # Anything else secret that gets reflected into a page would have to be
    # weighed again before it is added.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Deliberately not touching HSTS, X-Frame-Options or the referrer policy:
    # Django sets all of them from `production.py`, and a second source would
    # eventually disagree with the first.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Content-hashed filenames, so the URL changes whenever the bytes do.
    # `nosniff` and the rest are repeated in every block that answers from
    # disk. Django's SecurityMiddleware sets them, but nginx serves these
    # paths itself and never reaches Django — so without this, uploaded files
    # are the only responses on the site with no security headers at all.
    # nginx's add_header does not inherit into a location that has its own,
    # which is why they cannot live once at server level.
    #
    # `always` on each: without it nginx drops the header on 4xx and 5xx, so
    # the one response most likely to be attacker-shaped is the one that would
    # go out unprotected.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        # One `Cache-Control`, not two. `expires 1y` emits its own
        # `Cache-Control: max-age=31536000` on top of whatever add_header sets,
        # and the response went out carrying the header twice. Browsers merge
        # them; a CDN in front is entitled to read only the first, which is the
        # one without `immutable`. Building the whole value by hand removes the
        # ambiguity. The `Expires` header goes with it — every client that
        # matters has preferred `max-age` over it for twenty years.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Editor leftovers and VCS metadata, if any ever reach the image.
        location ~ /\. {
            deny all;
        }
    }

    # In production media normally lives in the object-storage bucket and never
    # reaches nginx. Kept so the stack still works if `STORAGES` is pointed at
    # local disk.
    location /media/ {
        alias /app/media/;
        access_log off;
        # Seven days, in a single header — see the /static/ block above for why
        # `expires` is not used. Shorter than static because media filenames are
        # not content-hashed, so a replaced image has to be able to appear.
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        # An upload is attacker-supplied bytes under our own origin. Even
        # though nh3 cleans blog HTML and uploads are staff-only, a file that
        # a browser decides to render as a document would run script as this
        # site. CSP stops that, and the sandbox drops it to an opaque origin
        # so it cannot touch cookies or storage even if it does render.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Frame-Options "DENY" always;

        location ~ /\. {
            deny all;
        }
    }

    # The service worker controls every page under `/`, and a cached copy of an
    # old one keeps doing so. It is served with no-store by Django; this makes
    # sure no proxy layer decides otherwise.
    #
    # The proxy headers are repeated rather than inherited: a `location` does
    # not pick up the `proxy_set_header` lines of a sibling, so without them
    # this route reached Django with no forwarded address at all — and with no
    # X-Forwarded-Proto, which under SECURE_SSL_REDIRECT is an endless redirect
    # on the one URL the whole push feature hangs off.
    location = /sw.js {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # See the note in `location /` below: not
        # `$proxy_add_x_forwarded_for`, which would preserve a forged chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # `$remote_addr` is the real visitor even behind ArvanCloud, because of
        # the `real_ip_header` block at the top of this file.
        proxy_set_header X-Real-IP $remote_addr;
        # `$remote_addr`, not `$proxy_add_x_forwarded_for`. The latter appends
        # to whatever the client sent, so a request carrying a forged
        # `X-Forwarded-For: 6.6.6.6` reached Django as `6.6.6.6, <real ip>` —
        # and the client-IP helpers in `utils/http/mixins.py` and
        # `utils/security/login_throttle.py` take the *first* entry. They read
        # `X-Real-IP` first, which nginx overwrites, so nothing was actually
        # bypassable; but that made a rate-limit bypass depend on the order of
        # two lookups in a Python helper. `$remote_addr` is already the true
        # client (see the real_ip block at the top), so the inherited chain
        # carries nothing worth the risk.
        proxy_set_header X-Forwarded-For $remote_addr;
        # SECURE_PROXY_SSL_HEADER trusts this. Setting it here on every request
        # overwrites anything the client sent, so a forged header cannot make
        # Django treat a plain request as encrypted.
        #
        # `$scheme`, not the incoming X-Forwarded-Proto: this nginx terminates
        # TLS itself, so `$scheme` is the truth. Passing a client-supplied
        # value through would let anyone reaching port 80 directly claim HTTPS
        # and collect secure cookies over plaintext. A CDN in front must
        # therefore be configured to speak HTTPS to the origin.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
