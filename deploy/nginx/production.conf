# Production proxy: TLS on 443, port 80 kept only for ACME and redirects.
#
# Replace sbdental.ir below if the domain changes — it appears in server_name
# and in the certificate paths, and the two must agree or nginx will not start.

# The app is addressed through a variable, not an `upstream` block, so that
# nginx re-resolves the name instead of pinning it at startup.
#
# nginx looks an `upstream` server's hostname up once, when the worker starts,
# and keeps that address for the life of the process. A deploy recreates the
# web container, Docker hands it a new IP, and nginx goes on dialling the old
# one: every request 502s while `docker compose up -d` reports success and the
# web container's own logs look perfectly healthy. The only cure is
# restarting nginx, which nothing in the deploy does.
#
# `resolver 127.0.0.11` is Docker's embedded DNS; `valid=10s` is how long an
# answer is trusted, so a recreated container is picked up within ten seconds.
# `ipv6=off` because it answers AAAA for `web` on some daemons and nginx then
# tries an address nothing is listening on.
#
# The cost is upstream keepalive, which a variable target cannot use — every
# proxied request opens a fresh connection to gunicorn. At this traffic that
# is a rounding error next to a site that is silently down after a deploy.
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $django_upstream {
    default web:8000;
}

# --- Port 80: certificate renewal, then send everyone to HTTPS --------------
server {
    listen 80;
    server_name sbdental.ir www.sbdental.ir;

    # Must stay on plain HTTP and must not redirect: this is the path Let's
    # Encrypt fetches to prove the domain is ours, and it checks it over
    # port 80 before any certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name sbdental.ir www.sbdental.ir;

    ssl_certificate     /etc/letsencrypt/live/sbdental.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbdental.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 30 images at 5MB each is the gallery's own ceiling; nginx's 1MB default
    # would reject that as a 413 with no explanation the uploader can act on.
    client_max_body_size 60M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Compression pays for itself on Persian HTML and on the CSS bundle. Images
    # and woff2 are already compressed, so they are left out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Deliberately not touching HSTS, X-Frame-Options or the referrer policy:
    # Django sets all of them from `production.py`, and a second source would
    # eventually disagree with the first.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Content-hashed filenames, so the URL changes whenever the bytes do.
    # `nosniff` and the rest are repeated in every block that answers from
    # disk. Django's SecurityMiddleware sets them, but nginx serves these
    # paths itself and never reaches Django — so without this, uploaded files
    # are the only responses on the site with no security headers at all.
    # nginx's add_header does not inherit into a location that has its own,
    # which is why they cannot live once at server level.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # In production media normally lives in the Liara S3 bucket and never
    # reaches nginx. Kept so the stack still works if `STORAGES` is pointed at
    # local disk.
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # An upload is attacker-supplied bytes under our own origin. Even
        # though nh3 cleans blog HTML and uploads are staff-only, a file that
        # a browser decides to render as a document would run script as this
        # site. CSP stops that, and the sandbox drops it to an opaque origin
        # so it cannot touch cookies or storage even if it does render.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox";
        add_header X-Frame-Options "DENY";
    }

    # The service worker controls every page under `/`, and a cached copy of an
    # old one keeps doing so. It is served with no-store by Django; this makes
    # sure no proxy layer decides otherwise.
    location = /sw.js {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER trusts this. Setting it here on every request
        # overwrites anything the client sent, so a forged header cannot make
        # Django treat a plain request as encrypted.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
