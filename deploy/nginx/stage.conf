# Staging proxy. Plain HTTP — see production.conf for the TLS version.
#
# Dropped into /etc/nginx/conf.d/ rather than replacing nginx.conf wholesale,
# so the image's own `http {}` block (mime types, sendfile, gzip defaults)
# stays in place instead of having to be re-declared correctly here.

# Stage sits behind something that terminates TLS for it — a Cloudflare tunnel,
# or an nginx on the host. That proxy tells us the visitor's real scheme in
# X-Forwarded-Proto; this container is always spoken to over plain HTTP, so
# `$scheme` here is *always* `http`. Passing `$scheme` on to Django, which
# inherits SECURE_SSL_REDIRECT from production.py, means Django sees an
# unencrypted request, redirects to HTTPS, and the proxy hands the same
# request back — an infinite redirect loop with no error anywhere.
#
# `default $scheme` keeps a direct `curl http://localhost:8080` honest, so a
# client cannot claim HTTPS by inventing the header when no proxy set it.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# A variable rather than an `upstream` block, so nginx re-resolves the name.
# An `upstream` server's hostname is looked up once when the worker starts and
# kept for the life of the process: recreating the web container hands it a
# new IP and nginx keeps dialling the old one, answering 502 to everything
# while `docker compose up -d` reports success. See production.conf for the
# longer version — the trade-off is upstream keepalive, which a variable
# target cannot use.
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $django_upstream {
    default web:8000;
}

server {
    listen 80;
    server_name _;

    # The app accepts up to 30 images of 5MB in one gallery upload. nginx's
    # default is 1MB, which turns that into a 413 the user cannot explain.
    client_max_body_size 60M;

    # An upload over a slow Iranian mobile link can take minutes; the default
    # 60s read timeout would drop it partway through.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Compose polls this; it must not touch the database, so that a failing
    # query shows up as 500s rather than as an unhealthy container that gets
    # restarted in a loop.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed filenames (ManifestStaticFilesStorage) mean the URL changes
    # whenever the content does, so these can be cached hard and forever.
    # `nosniff` and the rest are repeated in every block that answers from
    # disk. Django's SecurityMiddleware sets them, but nginx serves these
    # paths itself and never reaches Django — so without this, uploaded files
    # are the only responses on the site with no security headers at all.
    # nginx's add_header does not inherit into a location that has its own,
    # which is why they cannot live once at server level.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Media names are not content-hashed, so a shorter window: long enough to
    # help, short enough that a replaced image appears the same day.
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # An upload is attacker-supplied bytes under our own origin. Even
        # though nh3 cleans blog HTML and uploads are staff-only, a file that
        # a browser decides to render as a document would run script as this
        # site. CSP stops that, and the sandbox drops it to an opaque origin
        # so it cannot touch cookies or storage even if it does render.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox";
        add_header X-Frame-Options "DENY";
    }

    location / {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Read by SECURE_PROXY_SSL_HEADER in production settings. Comes from
        # the `map` above: the outer proxy's value when it set one, this
        # connection's scheme otherwise — never a value the client invented.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
